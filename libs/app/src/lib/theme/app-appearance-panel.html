<section class="flex flex-col gap-2">
  <h3 class="text-sm font-medium">Color de acento</h3>
  <div class="flex flex-wrap gap-2" role="radiogroup" aria-label="Color de acento">
    @for (a of accents; track a.hex) {
      <button
        type="button"
        role="radio"
        class="ring-offset-background focus-visible:ring-ring size-8 rounded-full border transition-shadow outline-none focus-visible:ring-2 focus-visible:ring-offset-2"
        [class.ring-2]="theme.prefs().accent === a.hex"
        [class.ring-ring]="theme.prefs().accent === a.hex"
        [class.ring-offset-2]="theme.prefs().accent === a.hex"
        [style.background-color]="a.hex"
        [attr.aria-checked]="theme.prefs().accent === a.hex"
        [attr.aria-label]="a.label"
        [attr.title]="a.label"
        (click)="set('accent', a.hex)"
      ></button>
    }
  </div>
</section>

<section class="flex flex-col gap-2">
  <h3 class="text-sm font-medium">Modo</h3>
  <hlm-toggle-group
    type="single"
    variant="outline"
    [value]="theme.prefs().appearance"
    (valueChange)="set('appearance', $any($event))"
    aria-label="Modo de color"
  >
    @for (o of appearances; track o.value) {
      <button hlmToggleGroupItem [value]="o.value">{{ o.label }}</button>
    }
  </hlm-toggle-group>
</section>

<section class="flex flex-col gap-2">
  <h3 class="text-sm font-medium">Tamaño</h3>
  <hlm-toggle-group
    type="single"
    variant="outline"
    [value]="theme.prefs().scale"
    (valueChange)="set('scale', $any($event))"
    aria-label="Tamaño de la interfaz"
  >
    @for (o of scales; track o.value) {
      <button hlmToggleGroupItem [value]="o.value">{{ o.label }}</button>
    }
  </hlm-toggle-group>
</section>

<section class="flex flex-col gap-2">
  <h3 class="text-sm font-medium">Densidad</h3>
  <hlm-toggle-group
    type="single"
    variant="outline"
    [value]="theme.prefs().density"
    (valueChange)="set('density', $any($event))"
    aria-label="Densidad"
  >
    @for (o of densities; track o.value) {
      <button hlmToggleGroupItem [value]="o.value">{{ o.label }}</button>

</section>

<section class="flex flex-col gap-2">
  <h3 class="text-sm font-medium">Bordes</h3>
  <hlm-toggle-group
    type="single"
    variant="outline"
    [value]="theme.prefs().radius"
    (valueChange)="set('radius', $any($event))"
    aria-label="Radio de bordes"
  >
    @for (o of radii; track o.value) {
      <button hlmToggleGroupItem [value]="o.value">{{ o.label }}</button>
    }
  </hlm-toggle-group>
</section>

<div>
  <app-button variant="ghost" size="sm" leftIcon="lucideRotateCcw" (click)="theme.reset()">Restablecer</app-button>
</div>
